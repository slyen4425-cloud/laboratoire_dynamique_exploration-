name: Import Forest Material Test Assets v1

on:
  push:
    branches:
      - work/exploration-material-assets-forest-test-v1-2026-10-01
    paths:
      - '.github/workflows/import-forest-material-assets-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset work branch
        uses: actions/checkout@v4
        with:
          ref: work/exploration-material-assets-forest-test-v1-2026-10-01
          fetch-depth: 0

      - name: Unpack controlled test assets
        shell: bash
        run: |
          set -euo pipefail

          ROOT="assets/exploration/materials/forest"
          ZIP="$ROOT/.import/material-assets-forest-test-v1.zip"
          TMP="$(mktemp -d)"

          test -f "$ZIP"
          unzip -q "$ZIP" -d "$TMP"

          mkdir -p             "$ROOT/surfaces"             "$ROOT/paths"             "$ROOT/water"             "$ROOT/transitions"             "$ROOT/decals"

          install -m 0644 "$TMP/grass_forest_base_01.webp"             "$ROOT/surfaces/grass_forest_base_01.webp"
          install -m 0644 "$TMP/grass_forest_base_02.webp"             "$ROOT/surfaces/grass_forest_base_02.webp"
          install -m 0644 "$TMP/road_dirt_base_01.webp"             "$ROOT/paths/road_dirt_base_01.webp"
          install -m 0644 "$TMP/water_forest_stream_base_01.webp"             "$ROOT/water/water_forest_stream_base_01.webp"
          install -m 0644 "$TMP/road_dirt_to_grass_forest_edge_01.webp"             "$ROOT/transitions/road_dirt_to_grass_forest_edge_01.webp"
          install -m 0644 "$TMP/water_forest_stream_to_grass_forest_bank_01.webp"             "$ROOT/transitions/water_forest_stream_to_grass_forest_bank_01.webp"
          install -m 0644 "$TMP/leaves_forest_floor_decal_01.webp"             "$ROOT/decals/leaves_forest_floor_decal_01.webp"
          install -m 0644 "$TMP/roots_forest_floor_decal_01.webp"             "$ROOT/decals/roots_forest_floor_decal_01.webp"

          cat > "$ROOT/manifest-v1.json" <<'JSON'
          {
            "schemaVersion": 1,
            "packId": "forest-core-v1-test-assets",
            "status": "test",
            "ownership": "exploration",
            "derivation": {
              "purpose": "mobile Material Pack v1 validation",
              "format": "webp",
              "note": "Downscaled derivatives of ChatGPT-generated source images; geometry and collision remain independent."
            },
            "assets": [
              {
                "assetId": "texture.grass.forest.base.01",
                "path": "./assets/exploration/materials/forest/surfaces/grass_forest_base_01.webp",
                "role": "surface-base",
                "materialId": "grass.forest",
                "size": [96, 96],
                "sourceGenerationId": "6fc53ef8-1f29-4716-bdad-6084b77c19f3"
              },
              {
                "assetId": "texture.grass.forest.base.02",
                "path": "./assets/exploration/materials/forest/surfaces/grass_forest_base_02.webp",
                "role": "surface-variant",
                "materialId": "grass.forest",
                "size": [96, 96],
                "sourceGenerationId": "0518c805-7f30-40db-8373-a94424d7ad7c"
              },
              {
                "assetId": "texture.road.dirt.base.01",
                "path": "./assets/exploration/materials/forest/paths/road_dirt_base_01.webp",
                "role": "path-center",
                "materialId": "road.dirt",
                "size": [96, 96],
                "sourceGenerationId": "41d4fd87-75db-41b8-820c-bea6a5ec9d50"
              },
              {
                "assetId": "texture.water.forest_stream.base.01",
                "path": "./assets/exploration/materials/forest/water/water_forest_stream_base_01.webp",
                "role": "water-center",
                "materialId": "water.forest_stream",
                "size": [96, 96],
                "sourceGenerationId": "df4c9e9a-621d-4c1b-a87e-ce4d07c08b68"
              },
              {
                "assetId": "transition.road.dirt.grass_forest.edge.01",
                "path": "./assets/exploration/materials/forest/transitions/road_dirt_to_grass_forest_edge_01.webp",
                "role": "path-edge",
                "materialId": "road.dirt",
                "size": [144, 48],
                "sourceGenerationId": "f0d555e5-0138-4459-991c-161792ad9a4b"
              },
              {
                "assetId": "transition.water.forest_stream.grass_forest.bank.01",
                "path": "./assets/exploration/materials/forest/transitions/water_forest_stream_to_grass_forest_bank_01.webp",
                "role": "water-bank",
                "materialId": "water.forest_stream",
                "size": [144, 48],
                "sourceGenerationId": "124eb5a3-144e-4755-8ffc-7e29980ecead"
              },
              {
                "assetId": "decal.forest.leaves.01",
                "path": "./assets/exploration/materials/forest/decals/leaves_forest_floor_decal_01.webp",
                "role": "decal",
                "materialId": "grass.forest",
                "size": [96, 96],
                "sourceGenerationId": "89eb5dd0-56f2-4326-877d-e401c078858a"
              },
              {
                "assetId": "decal.forest.roots.01",
                "path": "./assets/exploration/materials/forest/decals/roots_forest_floor_decal_01.webp",
                "role": "decal",
                "materialId": "grass.forest",
                "size": [96, 96],
                "sourceGenerationId": "90aa3fdc-1889-4c29-a303-f7c442c38104"
              }
            ]
          }
          JSON

          (
            cd "$ROOT"
            sha256sum               surfaces/grass_forest_base_01.webp               surfaces/grass_forest_base_02.webp               paths/road_dirt_base_01.webp               water/water_forest_stream_base_01.webp               transitions/road_dirt_to_grass_forest_edge_01.webp               transitions/water_forest_stream_to_grass_forest_bank_01.webp               decals/leaves_forest_floor_decal_01.webp               decals/roots_forest_floor_decal_01.webp               > SHA256SUMS.txt
          )

          rm -rf "$ROOT/.import"
          rm -f .github/workflows/import-forest-material-assets-v1.yml

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "assets: import forest material test pack v1"
          git push origin HEAD:work/exploration-material-assets-forest-test-v1-2026-10-01
