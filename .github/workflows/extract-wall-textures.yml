name: Extract wall textures (isolated asset branch)
on:
  push:
    branches:
      - work/exploration-interior-wall-textures-2026-11-03
    paths:
      - tools/extract_interior_wall_textures.py
      - .github/workflows/extract-wall-textures.yml
      - assets/exploration/materials/interior/walls/exploration_wall_textures_5.zip
permissions:
  contents: write
concurrency:
  group: extract-wall-textures-${{ github.ref }}
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python tools/extract_interior_wall_textures.py
      - name: Commit extracted WebP and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/exploration/materials/interior/walls/*.webp assets/exploration/materials/interior/walls/manifest.v1.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(interior): unpack five wall textures"
            git push
          fi
