name: Exploration Encounter Landscape HUD Gate
on:
  push:
    branches:
      - work/exploration-encounter-landscape-hud-gate-2026-10-15
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Exploration working source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exploration source checks
        run: npm test && npm run check
      - name: Checkout pinned current Combat bridge
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: a4f4ae112cc8c660a4b9a59be79dfdfc6f1bce0c
          path: combat-preview
      - name: Checkout pinned Capture global assets
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: e55fea3b559c348be596d7c16250808a39c315a1
          path: capture-assets
      - name: Verify the actual modern Combat interop interface
        run: node scripts/audit-combat-preview.mjs combat-preview
      - name: Real Chromium Builder encounter gate
        run: node scripts/smoke-builder-encounter-validation.mjs
      - name: Real Chromium Encounter combat HUD
        run: node scripts/smoke-modern-combat-preview.mjs
