name: Replace green hero approved walk frames (work only)
on:
  push:
    branches: [work/exploration-hero-sprite-repair-20261126]
    paths: [GenSRPG_heros_vert_remplacement_20261127.zip]
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/exploration-hero-sprite-repair-20261126
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/replace-green-hero-walk-20261127.py
      - run: python scripts/replace-green-hero-walk-20261127.py --check
      - name: Commit only the existing official frame paths
        run: |
          set -euo pipefail
          git add -- assets/exploration/actors/official/02_heros_vert/frames/
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only | wc -l)" -eq 48
          git config user.name 'gensrpg-hero-assets[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(exploration): remplacer les 48 sprites de marche du héros vert'
          git push origin HEAD:work/exploration-hero-sprite-repair-20261126
