name: Import approved winter houses (temporary)
on:
  push:
    branches:
      - work/exploration-snow-houses-10x3-assets-2026-11-04
    paths:
      - .github/workflows/import-snow-houses-once.yml

permissions:
  contents: write

jobs:
  import-snow-houses:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Extract, verify and stage exactly 30 approved RGBA house views
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, hashlib, json, collections
          path=pathlib.Path('GENSRPG_LaboExploration_Maisons_Enneigees_10x3.zip')
          assert path.is_file(),'Missing approved source ZIP'
          with zipfile.ZipFile(path) as z:
            assert z.testzip() is None,'Corrupted ZIP'
            manifest=json.loads(z.read('manifest.snow-houses.v1.json'))
            assert manifest['schemaVersion']==1
            assert manifest['packId']=='winter-houses-2p5d-10x3-v1'
            assert len(manifest['models'])==10 and len(manifest['files'])==30
            assert len(set(x['id'] for x in manifest['models']))==10
            known={x['id'] for x in manifest['models']}
            views=collections.defaultdict(set)
            paths=set()
            for entry in manifest['files']:
              name=entry['path']
              view=entry['view']
              model=entry['variant']
              assert model in known and view in {'front','side','back'}
              assert name=='assets/exploration/objects/buildings/building_house_snow_'+model+'_2p5d_'+view+'_01.webp',name
              assert entry['assetId']=='object.building.house.snow_'+model+'_2p5d.'+view+'.01',entry['assetId']
              assert entry['perspective']=='three-quarter-2.5d'
              assert entry['width']==entry['height']==384 and entry['alpha'] is True
              assert view not in views[model] and name not in paths, 'Duplicate view/path'
              views[model].add(view)
              paths.add(name)
              raw=z.read(name)
              assert len(raw)==entry['bytes'],name+': size'
              assert hashlib.sha256(raw).hexdigest()==entry['sha256'],name+': checksum'
              assert raw[:4]==b'RIFF' and raw[8:16]==b'WEBPVP8X'
              assert int.from_bytes(raw[4:8],'little')+8==len(raw)
              assert raw[20]&0x10,name+': missing alpha channel'
              assert int.from_bytes(raw[24:27],'little')+1==384
              assert int.from_bytes(raw[27:30],'little')+1==384
              destination=pathlib.Path(name)
              assert not destination.exists(),'Refusing to overwrite '+name
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(raw)
            assert all(v=={'front','side','back'} for v in views.values()) and len(views)==10
            manifest_path=pathlib.Path('assets/exploration/objects/buildings/manifest.snow-houses.v1.json')
            assert not manifest_path.exists(),'Refusing overwrite manifest'
            manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
            sums_path=pathlib.Path('assets/exploration/objects/buildings/SHA256SUMS.snow-houses-v1.txt')
            assert not sums_path.exists(),'Refusing overwrite checksums'
            sums_path.write_bytes(z.read('SHA256SUMS.txt'))
            print('GREEN: approved 30 RGBA house views 384x384, 10x(front,side,back), SHA256 checked')
          PY
      - name: Commit only approved house WebP assets and their provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/exploration/objects/buildings/building_house_snow_*_2p5d_*.webp
          git add assets/exploration/objects/buildings/manifest.snow-houses.v1.json
          git add assets/exploration/objects/buildings/SHA256SUMS.snow-houses-v1.txt
          test "$(git diff --cached --name-only | grep -c 'building_house_snow_.*\.webp')" -eq 30
          git diff --cached --stat
          git commit -m "assets(exploration): exact 30 approved snowy house WebPs and hashes [skip ci]"
          git push origin HEAD:work/exploration-snow-houses-10x3-assets-2026-11-04
