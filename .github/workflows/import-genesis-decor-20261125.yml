name: Import unique des décors Genesis 20261125
on:
  push:
    branches: [work/exploration-decor-assets-20261125]
    paths: ['.github/workflows/import-genesis-decor-20261125.yml', 'scripts/import-genesis-decor-20261125.py']
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/import-genesis-decor-20261125.yml', 'scripts/import-genesis-decor-20261125.py']
concurrency:
  group: genesis-decor-import-20261125
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  import:
    if: github.event_name == 'push' || (github.head_ref == 'work/exploration-decor-assets-20261125' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/exploration-decor-assets-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pillow numpy scipy
      - run: |
          if [ -f assets/exploration/objects/manifest.genesis-decor-20261125.json ]; then
            echo 'Import already committed; refusing duplicate generation'
            exit 0
          fi
          python scripts/import-genesis-decor-20261125.py
      - run: node --test tests/genesis-decor-assets-20261125.test.js
      - uses: actions/upload-artifact@v4
        if: hashFiles('assets/exploration/objects/manifest.genesis-decor-20261125.json') != ''
        with:
          name: genesis-decor-contact-sheet
          path: /tmp/genesis-decor-preview.jpg
          if-no-files-found: ignore
      - name: Commit generated native assets to work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/exploration/objects src/objects/object-definition-catalog.js src/objects/object-library-taxonomy.js src/assets/world-object-asset-adapter.js
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(assets): intégrer les sprites Genesis détourés et les références officielles"
          git push origin HEAD:work/exploration-decor-assets-20261125
