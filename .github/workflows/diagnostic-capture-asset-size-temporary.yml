name: Temporary Capture assets size inventory
on:
  pull_request:
    paths:
      - .github/workflows/diagnostic-capture-asset-size-temporary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout global assets branch without changing it
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: global-assets
          path: capture-assets
      - name: Checkout PR source for exact catalog package
        uses: actions/checkout@v4
        with:
          path: exploration
      - name: Verify reduced Capture package preserves every catalog referenced file
        shell: bash
        run: |
          set -euo pipefail
          node exploration/scripts/stage-pages-capture-assets.mjs capture-assets /tmp/exploration-capture-published
          du -sh /tmp/exploration-capture-published
          test -s /tmp/exploration-capture-published/data/assets/catalog/global-visual-assets.v1.json
          test -s /tmp/exploration-capture-published/assets/library/capture/creatures/heriplante/animations/movement/opponent/atlases/heriplante_movement_opponent_12f.webp
      - name: Measure all asset families and largest files
        shell: bash
        run: |
          set -euo pipefail
          echo "TOTAL"; du -sh capture-assets
          echo "TOP SIZE LEVEL 1"; du -h --max-depth=1 capture-assets | sort -h
          echo "TOP SIZE LEVEL 3"; du -h --max-depth=3 capture-assets | sort -h | tail -n 85
          echo "LARGEST FILES"; find capture-assets -type f -size +5M -printf '%s %p\n' | sort -nr | head -n 80 || true
          echo "CATEGORIES"; find capture-assets -type f | awk -F. '{print $NF}' | sort | uniq -c | sort -nr | head -n 30
