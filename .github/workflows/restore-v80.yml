name: Restore verified V80 to GitHub Pages
on:
  push:
    branches:
      - work/exploration-v80-door-html-cachefix-20261026
    paths:
      - '.github/workflows/restore-v80.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V80 source and assets
        run: |
          set -euo pipefail
          npm run check
          npm test
          test -s sculpt-lab-v80.html
          test -s src/sculpt-lab-main.js
          test -s assets/interiors/doors/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('assets/interiors/doors/manifest.json').read_text())
          assert len(m['items'])==20
          for item in m['items']:
              assert Path(item['file']).is_file(), item['file']
          print('V80 door assets validated')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
