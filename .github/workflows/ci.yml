name: Exploration CI

on:
  push:
    branches:
      - main
      - 'work/**'
      - 'checkpoint/**'
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check

  modern-combat-encounter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Exploration integration
        uses: actions/checkout@v4
      - name: Checkout immutable tested Combat bridge
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: 3f612ec0cf4adf4bf5aa0a2594131613ce16ceec
          path: combat-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify packaged owner contracts before the browser
        run: node scripts/audit-combat-preview.mjs combat-preview
      - name: Real Chromium Encounter startup smoke
        run: node scripts/smoke-modern-combat-preview.mjs
