name: Exploration CI

on:
  push:
    branches:
      - main
      - 'work/**'
      - 'checkpoint/**'
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
