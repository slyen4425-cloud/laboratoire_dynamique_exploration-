name: Exploration CI

on:
  push:
    branches:
      - main
      - 'work/**'
      - 'checkpoint/**'
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check

  modern-combat-encounter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Exploration integration
        uses: actions/checkout@v4
      - name: Checkout immutable tested Combat bridge
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: 11a9f70b5f6cf6850fc4bedfd876d799635c33db
          path: combat-preview
      - name: Checkout immutable Capture visual asset authority for Builder boot
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: e55fea3b559c348be596d7c16250808a39c315a1
          path: capture-assets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify packaged owner contracts before the browser
        run: node scripts/audit-combat-preview.mjs combat-preview
      - name: Real Chromium Builder invalid-encounter navigation smoke
        run: node scripts/smoke-builder-encounter-validation.mjs
      - name: Real Chromium Encounter startup smoke
        run: node scripts/smoke-modern-combat-preview.mjs
