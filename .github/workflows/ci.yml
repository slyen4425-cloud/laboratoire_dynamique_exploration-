name: Exploration CI

on:
  push:
    branches:
      - main
      - 'work/**'
      - 'checkpoint/**'
  pull_request:

concurrency:
  group: exploration-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check

  modern-combat-encounter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Exploration integration
        uses: actions/checkout@v4
      - name: Checkout live official Combat engine
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: main
          path: combat-preview
      - name: Assemble isolated Exploration bridge over official Combat
        run: |
          cp integration/combat-bridge/exploration-encounter.html combat-preview/examples/dom-demo/exploration-encounter.html
          cp integration/combat-bridge/exploration-encounter.js combat-preview/examples/dom-demo/exploration-encounter.js
          cp integration/combat-bridge/exploration-native-source-v1.js combat-preview/examples/dom-demo/exploration-native-source-v1.js
          cp integration/combat-bridge/party.preview.v1.json combat-preview/examples/dom-demo/party.preview.v1.json
          git -C combat-preview rev-parse HEAD > combat-preview/.exploration-combat-source-sha
      - name: Checkout immutable Capture visual asset authority for Builder boot
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: e55fea3b559c348be596d7c16250808a39c315a1
          path: capture-assets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runtime ownership and native adapter contracts
        run: |
          node scripts/audit-combat-preview.mjs combat-preview
          node scripts/combat-native-bridge-smoke.mjs
      - name: Real Chromium Builder invalid-encounter navigation smoke
        run: node scripts/smoke-builder-encounter-validation.mjs
      - name: Real Chromium interior floor material and brush smoke
        run: node scripts/smoke-interior-floor-brush.mjs
      - name: Real Chromium opt-in relief canyon Builder and SVG gate
        run: node scripts/smoke-relief-canyon-pilot.mjs
      - name: Real Chromium sculptable terrain lab brush and material smoke
        run: node scripts/smoke-sculpt-terrain-lab.mjs
      - name: Real Chromium Encounter startup smoke
        run: node scripts/smoke-modern-combat-preview.mjs
