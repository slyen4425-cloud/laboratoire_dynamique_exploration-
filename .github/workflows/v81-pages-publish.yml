name: Publish V80 and isolated V81 to Pages
on:
  push:
    branches:
      - work/exploration-v80-door-html-cachefix-20261026
    paths:
      - 'v81/**'
      - '.github/workflows/v81-pages-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate both version entrypoints
        run: |
          test -s sculpt-lab-v80.html
          test -s v81/sculpt-lab-v81.html
          test -s v81/src/sculpt-lab-main.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
