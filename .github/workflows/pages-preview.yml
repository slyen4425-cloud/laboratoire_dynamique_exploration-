name: Exploration Preview
# preview-revision: phase7-showcase-duel-moussados-loup-v1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: exploration-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exploration work branch
        uses: actions/checkout@v4
        with:
          ref: work/exploration-phase7-combat-handoff-v1-2026-10-03

      - name: Checkout Combat bridge preview
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: preview/lab-showcase-duel-moussados-loup-energy-v1-2026-10-03
          path: combat-preview

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
