name: Exploration Preview
# preview-revision: v80-doors-2026-10-26

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: exploration-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Exploration selected-element encounters with canonical Capture UI browser gates
        uses: actions/checkout@v4
        with:
          ref: work/exploration-door-assets-v80-2026-10-26

      - name: Configure Node for immutable integration checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify V80 door catalog and files
        run: |
          npm test
          npm run check
          node --check src/world/interior-material-catalog.js
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('assets/interiors/doors/manifest.json').read_text())
          assert len(m['items']) == 20
          for item in m['items']:
              assert Path(item['file']).is_file(), item['file']
          assert 'interior-door-asset' in Path('sculpt-lab.html').read_text()
          print('V80 doors validated')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
