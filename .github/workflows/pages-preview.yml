name: Exploration Preview
# preview-revision: builder-encounter-quick-setup-v1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: exploration-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Exploration Builder Earth-only quick setup browser-GREEN preview
        uses: actions/checkout@v4
        with:
          ref: 53b74309a28623f3baef3a9f8e2708d9d64908fa

      - name: Configure Node for immutable integration checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the Exploration baseline
        run: npm test && npm run check

      - name: Checkout Combat native modern Encounter browser GREEN prevalidation
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: 3f612ec0cf4adf4bf5aa0a2594131613ce16ceec
          path: combat-preview

      - name: Checkout Capture global visual assets
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: e55fea3b559c348be596d7c16250808a39c315a1
          path: capture-assets

      - name: Fail closed if modern Combat has no real native bridge
        run: node scripts/audit-combat-preview.mjs combat-preview

      - name: Verify invalid encounters and actual valid Builder game launch in Chromium
        run: node scripts/smoke-builder-encounter-validation.mjs

      - name: Verify actual encounter startup in Chromium
        run: node scripts/smoke-modern-combat-preview.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
