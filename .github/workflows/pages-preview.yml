name: Exploration Preview
# preview-revision: combat-bridge-convergence-v1-bootstrap-v2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: exploration-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Exploration World Event Building Entry Drag preview
        uses: actions/checkout@v4
        with:
          ref: preview/exploration-world-event-building-entry-drag-v1-2026-10-04

      - name: Checkout Combat Exploration Bridge Convergence preview
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: preview/lab-exploration-bridge-convergence-v1-2026-10-04
          path: combat-preview

      - name: Checkout Capture global visual assets
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: global-assets
          path: capture-assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
