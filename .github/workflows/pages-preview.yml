name: Exploration Preview V80
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: exploration-preview
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved V80 exploration build
        uses: actions/checkout@v4
        with:
          ref: work/exploration-door-assets-v80-2026-10-26
          persist-credentials: false
      - name: Check V80 deployment payload
        shell: bash
        run: |
          set -euo pipefail
          test -s sculpt-lab.html
          test -s src/sculpt-lab-main.js
          test -s src/world/interior-material-catalog.js
          test -s assets/interiors/doors/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('assets/interiors/doors/manifest.json').read_text())
          assert len(manifest['items'])==20
          assert len({x['model'] for x in manifest['items']})==10
          assert all(Path(x['file']).is_file() for x in manifest['items'])
          html=Path('sculpt-lab.html').read_text()
          assert 'object.door.interior.bois_renforce.face' in html
          print('V80 artifact OK: 10 models, 20 PNG')
          PY
          echo 'V80-DOORS-2026-10-26' > V80-DOORS-DEPLOYED.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
