name: Exploration Preview
# preview-revision: selected-elements-v2-with-current-combat-bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: exploration-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Exploration checkbox elements and unified rarity pool browser-GREEN preview
        uses: actions/checkout@v4
        with:
          ref: fca3f161f1ad33fa515577776193895e9a91d7f4

      - name: Configure Node for immutable integration checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the Exploration baseline
        run: npm test && npm run check

      - name: Checkout Combat native modern Encounter browser GREEN prevalidation
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: c61798e78fa6cc454aeb5f25294e997e398729f7
          path: combat-preview

      - name: Checkout Capture global visual assets
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: e55fea3b559c348be596d7c16250808a39c315a1
          path: capture-assets

      - name: Fail closed if modern Combat has no real native bridge
        run: node scripts/audit-combat-preview.mjs combat-preview

      - name: Verify Builder checkbox elements, blank map and real Encounter in Chromium
        run: node scripts/smoke-builder-encounter-validation.mjs

      - name: Verify actual encounter startup in Chromium
        run: node scripts/smoke-modern-combat-preview.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
