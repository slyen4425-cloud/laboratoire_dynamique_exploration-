name: Exploration Preview
# preview-revision: building-interiors-passages-ux-r1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: exploration-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Exploration Building Interiors Passages UX R1
        uses: actions/checkout@v4
        with:
          ref: preview/exploration-building-interiors-entrance-link-v1-2026-10-06

      - name: Checkout Combat Exploration Battle End Return preview
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: preview/lab-exploration-battle-end-return-v1-2026-10-05
          path: combat-preview

      - name: Checkout Capture global visual assets
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: global-assets
          path: capture-assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
