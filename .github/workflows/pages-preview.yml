name: Exploration Preview
# preview-revision: v78-r2-stairs-hero-visible-and-camera-perspective-2026-10-24

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: exploration-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Exploration selected-element encounters with canonical Capture UI browser gates
        uses: actions/checkout@v4
        with:
          ref: 134b608ef402392e78e02d72707ef8a6324b4bd2

      - name: Configure Node for immutable integration checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the Exploration baseline
        run: npm test && npm run check

      - name: Checkout Combat native modern Encounter browser GREEN prevalidation
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: 92e3c4b551f18dd766f51f1d4f92b76bae7e4d1d
          path: combat-preview

      - name: Checkout Capture global visual assets
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: e55fea3b559c348be596d7c16250808a39c315a1
          path: capture-assets

      - name: Fail closed if modern Combat has no real native bridge
        run: node scripts/audit-combat-preview.mjs combat-preview

      - name: Verify Builder checkbox elements, blank map and real Encounter in Chromium
        run: node scripts/smoke-builder-encounter-validation.mjs

      - name: Verify indoor floor palette and real brush in Chromium
        run: node scripts/smoke-interior-floor-brush.mjs

      - name: Verify optional canyon relief WorldDocument and SVG in Chromium
        run: node scripts/smoke-relief-canyon-pilot.mjs

      - name: Verify independent terrain sculpt lab and true pointer brush in Chromium
        run: node scripts/smoke-sculpt-terrain-lab.mjs

      - name: Verify actual encounter startup in Chromium
        run: node scripts/smoke-modern-combat-preview.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
