name: Extract interior door sprites
on:
  push:
    branches:
      - lot/portes-interieures-20-assets-20261026
    paths:
      - tools/extract_interior_doors.py
      - gensrpg_portes_20_vues_png.zip
      - .github/workflows/extract-interior-doors.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/extract_interior_doors.py
      - name: Commit extracted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/interiors/doors
          if ! git diff --cached --quiet; then
            git commit -m "assets: unpack 20 interior door sprites"
            git push
          fi
