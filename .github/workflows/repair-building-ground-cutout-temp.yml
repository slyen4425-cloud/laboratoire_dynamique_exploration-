name: TEMP — Rebuild bounded house exterior cutouts from approved originals
on:
  push:
    branches: [work/exploration-building-ground-props-removal-20261115]
permissions:
  contents: write
jobs:
  repair-house-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install transparent image processing dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pillow==11.3.0' 'opencv-python-headless==4.12.0.88'
      - name: Restore the previously approved original sprites before recutting
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e b44b7e25b67f647a85cf27fecc1c67feee3de65d^{commit}
          git restore --source=b44b7e25b67f647a85cf27fecc1c67feee3de65d --worktree -- ':(glob)assets/exploration/objects/buildings/building_house_snow_*_2p5d_*.webp' assets/exploration/objects/buildings/manifest.snow-houses.v1.json assets/exploration/objects/buildings/SHA256SUMS.snow-houses-v1.txt
          echo 'a27851cd830ae9a7dba18ade9c6218bd218eceabbc34020d80a0ecdbd1f65467  assets/exploration/objects/buildings/building_house_snow_alpine_timber_2p5d_side_01.webp' | sha256sum -c -
      - name: Cut only 14 hand-traced environmental regions and refresh canonical hashes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cleanup-house-environment-pixels.py
          python - <<'PY'
          import json
          p=json.load(open('/tmp/house-props-audit.json'))
          assert len(p)==14
          assert len({e['path'] for e in p})==14
          assert all(e['removed_pixels']>=1200 and e['alpha_mass_ratio']>.9 for e in p)
          assert not any(e['path'].endswith('building_house_snow_alpine_timber_2p5d_side_01.webp') for e in p)
          PY
          git diff --check
      - name: Commit only existing house assets and canonical ledgers
        shell: bash
        run: |
          set -euo pipefail
          git add assets/exploration/objects/buildings/
          git diff --cached --name-only | grep -q 'building_house_snow_'
          if git diff --cached --name-only | grep -Ev '^assets/exploration/objects/buildings/'; then
            echo 'Unexpected edits outside canonical building source' >&2; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(exploration): precise environment cleanup from approved 14 house sources'
          git push origin HEAD:work/exploration-building-ground-props-removal-20261115
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precise-houses-before-after
          path: |
            /tmp/house-props-before-after.png
            /tmp/house-props-audit.json
          if-no-files-found: warn
          retention-days: 14
