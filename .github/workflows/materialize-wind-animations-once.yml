name: Materialize six approved wind animations (one-off)
on:
  push:
    branches:
      - work/exploration-six-wind-animations-assets-2026-11-03
    paths:
      - 'assets/exploration/objects/animated/**'
      - 'scripts/materialize-wind-animations.py'
      - '.github/workflows/materialize-wind-animations-once.yml'
concurrency:
  group: wind-import-${{ github.ref }}
  cancel-in-progress: false
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible WebP renderer
        run: python3 -m pip install Pillow==11.3.0
      - name: Verify source ZIPs and unpack all frames
        run: |
          python3 scripts/materialize-wind-animations.py
          python3 scripts/materialize-wind-animations.py --extract --sheets
      - name: Commit materialized images, remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/exploration/objects/animated
          git rm .github/workflows/materialize-wind-animations-once.yml
          if ! git diff --cached --quiet; then
            git commit -m 'assets(exploration): materialize 72 PNG and 6 WebP wind sheets'
            git push origin HEAD:${{ github.ref_name }}
          fi
