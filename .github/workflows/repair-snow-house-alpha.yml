name: Repair canonical snow-house silhouettes (one-time scoped batch)
on:
  push:
    branches:
      - work/exploration-snow-house-alpha-repair-20261115
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image-processing tools
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0' 'numpy==2.3.2' 'scipy==1.16.1'
      - name: Verify and repair canonical 30-view house pack
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair-snow-house-alpha.py --apply --preview /tmp/snow-house-before-after.png --report /tmp/snow-house-audit.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/snow-house-audit.json'))
          assert len(p['files'])==30
          assert sum(f['state']=='cleaned' for f in p['files'])==29
          assert sum(f['state']=='artist-protected' for f in p['files'])==1
          assert p['delta_bytes']<4_000_000
          for f in p['files']:
              assert f['alpha_mass_ratio']>=.963
          PY
          git diff --check
          git diff --name-only
      - name: Preserve source paths, commit cleaned WebPs and checksum manifests
        shell: bash
        run: |
          set -euo pipefail
          git add assets/exploration/objects/buildings/
          git diff --cached --name-only | grep -q '^assets/exploration/objects/buildings/'
          if git diff --cached --name-only | grep -Ev '^assets/exploration/objects/buildings/'; then
            echo 'Unexpected out-of-scope write' >&2; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(exploration): clean snowy house alpha edges and terrain feet'
          git push origin HEAD:work/exploration-snow-house-alpha-repair-20261115
      - name: Keep before/after preview and asset integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-house-alpha-preview
          path: |
            /tmp/snow-house-before-after.png
            /tmp/snow-house-audit.json
          if-no-files-found: warn
          retention-days: 14
