# Historic filename retained to update the single existing Pages publisher
# atomically. This is the ONLY remaining Pages deployment authority.
# The old pages-preview.yml publisher is retired to prevent a later V80-only
# deployment from removing the isolated Encounter preview path.
name: Publish canonical main Exploration + frozen V80 preview
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # GitHub Actions cannot subscribe directly to another repository's push
  # with the default GITHUB_TOKEN. This cheap source-diff gate checks every
  # 30 minutes; the expensive Chromium/build/deploy jobs run only on change.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
# One authoritative Exploration source: the current main release commit,
# or the exact PR HEAD during review; not a detached work branch.
env:
  EXPLORATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
concurrency:
  # Deployments remain serialized on pages. PR-only validation never deploys,
  # so obsolete PR runs must not block the current validated source indefinitely.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.head_ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  detect-upstream:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.diff.outputs.publish }}
    steps:
      - name: Publish only when current Combat or assets changed
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote="https://github.com/slyen4425-cloud/GenSrpg_labo_combat_dynamique.git"
          main_sha="$(git ls-remote "$remote" refs/heads/main | cut -f1)"
          # Only the official Combat main commit may supply engine AND authored data.
          # Never import gh-pages/development effects before explicit main promotion.
          author_sha="$main_sha"
          assets_sha="$(git ls-remote "$remote" refs/heads/global-assets | cut -f1)"
          test -n "$main_sha" && test -n "$author_sha" && test -n "$assets_sha"
          published="$(mktemp)"
          if ! curl -fsSL --max-time 18 --retry 2 --retry-delay 2 \
            "https://slyen4425-cloud.github.io/laboratoire_dynamique_exploration-/preview/encounters-v80/release-provenance.v1.json?v=$(date +%s)" \
            -o "$published"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif jq -e --arg main "$main_sha" --arg author "$author_sha" --arg assets "$assets_sha" --arg exploration "$EXPLORATION_SOURCE_SHA" \
            '.schema=="gensrpg-exploration-combat-release-v1" and .combatMain==$main and .authorShowcase==$author and .visualAssets==$assets and .exploration==$exploration' "$published" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  verify-and-assemble:
    needs: detect-upstream
    if: needs.detect-upstream.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      combat_main: ${{ steps.provenance.outputs.combat_main }}
      author_showcase: ${{ steps.provenance.outputs.author_showcase }}
      visual_assets: ${{ steps.provenance.outputs.visual_assets }}
    steps:
      - name: Checkout byte-frozen V80 production source
        uses: actions/checkout@v4
        with:
          ref: 933c852c41c4511cb0eed0717c246cc6b19aeddc
          path: site
      - name: Checkout the authoritative main Exploration source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPLORATION_SOURCE_SHA }}
          path: encounter-source
      # The published site is a complete artifact, never an incremental upload.
      # A later scheduled main release must restage this already GREEN trial,
      # otherwise GitHub Pages removes /preview/rich-presets-pr301/ with a 404.
      # This checkout is read-only and cannot promote PR301 code into main.
      - name: Checkout pinned GREEN PR301 test preview (isolated from stable main)
        uses: actions/checkout@v4
        with:
          ref: 40955a7838beb8fb76e74fd4b941ce4bb7cd1505
          path: rich-source
      # CI GREEN on this exact fixed branch SHA. The pinned PR301 and frozen
      # V80 copies remain independently present in the complete Pages artifact.
      - name: Checkout pinned GREEN PR318 road-width corrected slope preview
        uses: actions/checkout@v4
        with:
          ref: 0dc90b9778b0a9e530adf7e90ac6d2506599c952
          path: ramp-source
      # Preview only: canonical waterfall placement and terrain-height UI,
      # pinned to the exact upstream CI HEAD (no PR code promoted into main).
      - name: Checkout pinned GREEN PR325 waterfall and 16-level UI correction source
        uses: actions/checkout@v4
        with:
          ref: d4b9d8c804e592392c5b7a2ec7cc2f160291a076
          path: waterfall-source
      # Full unified candidate already CI-validated under PR329 and
      # merged calm-area sublot PR333. One test-only preview; NEVER V80 root.
      - name: Checkout pinned unified mobile candidate from approved exact SHA
        uses: actions/checkout@v4
        with:
          ref: 77607520574c8509becf91a6dc55783e29c1570c
          path: unified-source
      - name: Checkout official current Capture Combat main
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: main
          path: combat-source
      - name: Checkout official Combat main author data only
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: main
          path: combat-author
      - name: Checkout current Capture visual catalog
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: global-assets
          path: capture-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Verify Combat main before staging its own canonical author data. No
      # gh-pages transfers or alternate author snapshot are permitted.
      - name: Verify official pristine Combat main foundation
        run: |
          cd combat-source
          npm run ci
      - name: Stage Combat main author transfers and marker data from the same SHA
        run: node encounter-source/scripts/stage-capture-author-showcase.mjs combat-author combat-source
      - name: Verify pinned Exploration GREEN and interoperable current Combat contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C site rev-parse HEAD)" = 933c852c41c4511cb0eed0717c246cc6b19aeddc
          test "$(git -C encounter-source rev-parse HEAD)" = "$EXPLORATION_SOURCE_SHA"
          test "$(git -C combat-author rev-parse HEAD)" = "$(git -C combat-source rev-parse HEAD)"
          test -s encounter-source/src/audio/exploration-soundtrack-v1.js
          printf 'Official Combat main tested at: %s\\n' "$(git -C combat-source rev-parse HEAD)"
          test -n "$(git -C capture-source rev-parse HEAD)"
          test -n "$(git -C combat-author rev-parse HEAD)"
          test -s combat-source/examples/dom-demo/exploration-author-provenance.v1.json
          test -s combat-source/data/capture/showcase/Spore_soporifique.capture-skill-transfer-v1.json
          test -s combat-source/data/capture/showcase/encounter-bundle.v1.json
          # The previously accepted Moussados Defense is an explicit release invariant.
          # Fail closed if Combat main has not promoted it; NEVER backfill it
          # from gh-pages or silently remove it from the released game.
          if ! jq -e '([.creatureTransfers[] | select(.draft.id=="crea_mossback" and .draft.combat.reaction.type=="defense" and .loadout.slots[1].skillId=="lib_earth_guard")] | length)==1' combat-source/data/capture/showcase/encounter-bundle.v1.json >/dev/null; then
            echo "::error::Combat main does not contain the approved Moussados Defense; main-only release blocked without development fallback"
            exit 1
          fi
          test -s site/sculpt-lab-v80.html
          # Four real, user-authorized runtime MP3s; no private source URLs.
          (
            cd encounter-source/assets/runtime/audio/exploration-v1
            printf '%s\n' \
              'c3a0cfffa5f022c4f1c23b8eaa7673a61781669f400c7a38bbeb9572c64a3657  exploration-01.mp3' \
              '5a10067b885ab5c1fa99ec9b8337679903bd294679b636991d9a1fd4e98868d7  exploration-02.mp3' \
              'ec94c86e82861899dd1f6771794acfa6c0645a4e8d6f545338f3875f06ee8ad8  exploration-03.mp3' \
              '2b9374c98e41a2343fe01027101f48e3443b87ee0043d107f585be7ffe657ce6  exploration-04.mp3' | sha256sum -c -
          )
          # The shipped Tester loads the corrected module URL, not an old
          # cached module which cannot resume Android's blocked play().
          grep -Fq 'exploration-mobile-real-play-r2' encounter-source/sculpt-lab.html
          grep -Fq 'retryExplorationAudioFromGesture' encounter-source/src/sculpt-lab-main.js
          test -s encounter-source/src/audio/exploration-soundtrack-v1.js
          test -s encounter-source/sculpt-lab.html
          test -s encounter-source/world-assembler.html
          test -s encounter-source/src/builder/sculpt-world-area-link.js
          test -s encounter-source/builder.html
          test -s encounter-source/index.html
          grep -Fq 'href="./world-assembler.html"' encounter-source/sculpt-lab.html
          grep -Fq 'id="graph-nodes"' encounter-source/world-assembler.html
          grep -Fq 'id="edit-sculpt-area"' encounter-source/world-assembler.html
          grep -Fq 'id="world-area-portal-panel"' encounter-source/sculpt-lab.html
          grep -Fq 'class="world-area-portal-panel" hidden>' encounter-source/sculpt-lab.html
          grep -Fq 'world-portal-v1-compact-ux-v1' encounter-source/sculpt-lab.html
          grep -Fq 'portalUi=compact1' encounter-source/src/builder/world-assembler-main.js
          grep -Fq 'id="world-portal-traverse"' encounter-source/sculpt-lab.html
          grep -Fq 'id="world-area-portal-label"' encounter-source/sculpt-lab.html
          grep -Fq 'id="world-area-portal-label-save"' encounter-source/sculpt-lab.html
          grep -Fq 'id="sculpt-map-preset-save"' encounter-source/sculpt-lab.html
          grep -Fq 'id="sculpt-map-preset-apply"' encounter-source/sculpt-lab.html
          grep -Fq 'id="world-workspace-map"' encounter-source/world-assembler.html
          grep -Fq 'id="area-width"' encounter-source/world-assembler.html
          grep -Fq 'id="area-height"' encounter-source/world-assembler.html
          grep -Fq 'id="world-workspace-world"' encounter-source/sculpt-lab.html
          grep -Fq 'id="world-area-create-another"' encounter-source/sculpt-lab.html
          test -s encounter-source/src/builder/world-area-size-command.js
          grep -Fq 'id="world-map-preset-select"' encounter-source/world-assembler.html
          test -s encounter-source/src/builder/sculpt-map-preset-library.js
          test -s encounter-source/src/builder/sculpt-builtin-map-presets.js
          test -s encounter-source/src/builder/sculpt-playable-zone-route.js
          grep -Fq 'id="world-playable-route"' encounter-source/world-assembler.html
          grep -Fq '<details id="navigation-hud"' encounter-source/sculpt-lab.html
          grep -Fq 'id="world-portal-feedback"' encounter-source/sculpt-lab.html
          grep -Fq 'function mapEdgePoint' encounter-source/src/builder/sculpt-map-preset-library.js
          grep -Fq 'id="world-workspace-return-float"' encounter-source/sculpt-lab.html
          grep -Fq 'id="world-area-unavailable-return"' encounter-source/sculpt-lab.html
          grep -Fq 'id="world-area-unavailable-create"' encounter-source/sculpt-lab.html
          grep -Fq 'sculptWorldAreaMounted' encounter-source/src/sculpt-lab-main.js
          grep -Fq 'Zone non éditable en 2,5D' encounter-source/src/builder/world-assembler-main.js
          grep -Fq 'resolveSculptAreaForEditor(draft,selectedId)' encounter-source/src/builder/world-assembler-main.js
          grep -Fq 'GREEN legacy Map tab' encounter-source/scripts/smoke-sculpt-terrain-lab.mjs
          test -s encounter-source/tests/world-map-legacy-compatible-navigation.test.js
          test -s encounter-source/tests/world-map-legacy-switch-regression.test.js
          test -s encounter-source/tests/world-preset-house-interiors.test.js
          grep -Fq 'createBuildingInteriorLink' encounter-source/src/builder/sculpt-map-preset-library.js
          grep -Fq 'Passage impossible en 2,5D' encounter-source/src/sculpt-lab-main.js
          grep -Fq 'house-interiors-v1' encounter-source/sculpt-lab.html
          grep -Fq "listAvailableSculptMapPresets" encounter-source/src/builder/world-assembler-main.js
          grep -Fq "persistCurrentWorldSculpt" encounter-source/src/sculpt-lab-main.js
          grep -Fq 'createWorldAreaFromSculptMapPreset' encounter-source/src/builder/world-assembler-main.js
          grep -Fq 'markersForSculptWorldArea' encounter-source/src/sculpt-lab-main.js
          grep -Fq 'setSculptWorldPortalLabel' encounter-source/src/builder/sculpt-world-area-link.js
          test -s encounter-source/src/builder/sculpt-world-portal-markers.js
          grep -Fq 'id="world-assembler-back"' encounter-source/builder.html
          grep -Fq 'id="mode-encounters"' encounter-source/sculpt-lab.html
          grep -Fq 'sculptEncounterConfig' encounter-source/src/sculpt-lab-main.js
          # Assemble only the versioned Exploration entry files OVER Combat main.
          # No forked combat engine or hard-coded equality to an older Combat SHA.
          cp encounter-source/integration/combat-bridge/exploration-encounter.html combat-source/examples/dom-demo/exploration-encounter.html
          cp encounter-source/integration/combat-bridge/exploration-encounter.js combat-source/examples/dom-demo/exploration-encounter.js
          cp encounter-source/integration/combat-bridge/exploration-native-source-v1.js combat-source/examples/dom-demo/exploration-native-source-v1.js
          cp encounter-source/integration/combat-bridge/party.preview.v1.json combat-source/examples/dom-demo/party.preview.v1.json
          test -s combat-source/examples/dom-demo/exploration-encounter.html
          (
            cd encounter-source
            npm test
            npm run check
            node scripts/audit-combat-preview.mjs ../combat-source
            ln -s "$GITHUB_WORKSPACE/combat-source" combat-preview
            ln -s "$GITHUB_WORKSPACE/capture-source" capture-assets
            node scripts/combat-native-bridge-smoke.mjs
            node scripts/smoke-modern-combat-preview.mjs
            node scripts/smoke-builder-encounter-validation.mjs
            rm capture-assets combat-preview
          )
      - name: Assemble an isolated directory; never overlay production V80
        shell: bash
        run: |
          set -euo pipefail
          preview="$GITHUB_WORKSPACE/site/preview/encounters-v80"
          mkdir -p "$preview"
          cp encounter-source/sculpt-lab.html encounter-source/sculpt-lab-v80.html "$preview/"
          cp encounter-source/world-assembler.html encounter-source/builder.html encounter-source/index.html "$preview/"
          cp encounter-source/play.html "$preview/"
          cp encounter-source/manifest.webmanifest "$preview/"
          # Verify the Exploration tests against their original repository
          # tree; Combat is a separate owner and has separate tests. Never
          # put two nested Git repositories under npm test's discovery root.
          for folder in src assets; do
            mkdir -p "$preview/$folder"
            rsync -a --exclude='.git' "encounter-source/$folder/" "$preview/$folder/"
          done
          mkdir -p "$preview/combat-preview" "$preview/capture-assets"
          rsync -a --exclude='.git' combat-source/ "$preview/combat-preview/"
          rsync -a --exclude='.git' capture-source/ "$preview/capture-assets/"
          for i in 01 02 03 04; do
            test -s "$preview/assets/runtime/audio/exploration-v1/exploration-$i.mp3"
          done
          test -s "$preview/src/sculpt-lab-main.js"
          test -s "$preview/src/builder/world-assembler-main.js"
          test -s "$preview/src/play/exploration-play-session.js"
          test -s "$preview/src/play/exploration-play-entry.js"
          grep -Fq 'id="play-new"' "$preview/play.html"
          grep -Fq 'id="play-continue"' "$preview/play.html"
          grep -Fq 'id="world-play-open"' "$preview/world-assembler.html"
          test -s "$preview/src/builder/world-assembler.css"
          grep -Fq 'id="graph-nodes"' "$preview/world-assembler.html"
          grep -Fq 'id="edit-sculpt-area"' "$preview/world-assembler.html"
          grep -Fq 'id="world-workspace-map"' "$preview/world-assembler.html"
          grep -Fq 'id="world-workspace-world"' "$preview/sculpt-lab.html"
          test -s "$preview/src/builder/world-area-size-command.js"
          test -s "$preview/src/builder/sculpt-builtin-map-presets.js"
          test -s "$preview/src/builder/sculpt-playable-zone-route.js"
          grep -Fq 'id="world-playable-route"' "$preview/world-assembler.html"
          grep -Fq 'id="world-workspace-return-float"' "$preview/sculpt-lab.html"
          grep -Fq 'id="world-area-portal-panel"' "$preview/sculpt-lab.html"
          grep -Fq 'class="world-area-portal-panel" hidden>' "$preview/sculpt-lab.html"
          grep -Fq 'world-portal-v1-compact-ux-v1' "$preview/sculpt-lab.html"
          grep -Fq 'id="world-assembler-back"' "$preview/builder.html"
          grep -Fq 'id="mode-encounters"' "$preview/sculpt-lab.html"
          test -s "$preview/assets/interiors/doors/manifest.json"
          test -s "$preview/combat-preview/examples/dom-demo/exploration-encounter.js"
          test -s "$preview/capture-assets/data/assets/catalog/global-visual-assets.v1.json"
          test -s "$preview/combat-preview/data/capture/showcase/Spore_soporifique.capture-skill-transfer-v1.json"
          test -s "$preview/combat-preview/data/capture/showcase/encounter-bundle.v1.json"
          test -s "$preview/src/encounters/combat-outcome-hold-v1.js"
          test -s "$preview/src/encounters/capture-combat-warmup-v1.js"
          test -s "$preview/combat-preview/examples/dom-demo/exploration-author-provenance.v1.json"
          test -s site/sculpt-lab-v80.html
          # Sentinel: serving preview must not change the V80 release document.
          cmp site/sculpt-lab-v80.html encounter-source/sculpt-lab-v80.html
          printf 'V80 locked; Encounter preview separately staged at /preview/encounters-v80/\n'
      - name: Record immutable provenance of the assembled release
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          preview="$GITHUB_WORKSPACE/site/preview/encounters-v80"
          main_sha="$(git -C combat-source rev-parse HEAD)"
          author_sha="$(git -C combat-author rev-parse HEAD)"
          assets_sha="$(git -C capture-source rev-parse HEAD)"
          exploration_sha="$(git -C encounter-source rev-parse HEAD)"
          jq -n --arg main "$main_sha" --arg author "$author_sha" \
            --arg assets "$assets_sha" --arg exploration "$exploration_sha" \
            '{schema:"gensrpg-exploration-combat-release-v1",combatMain:$main,authorShowcase:$author,visualAssets:$assets,exploration:$exploration}' \
            > "$preview/release-provenance.v1.json"
          echo "combat_main=$main_sha" >> "$GITHUB_OUTPUT"
          echo "author_showcase=$author_sha" >> "$GITHUB_OUTPUT"
          echo "visual_assets=$assets_sha" >> "$GITHUB_OUTPUT"
      - name: Stage pinned PR301 preview alongside stable main (never replace V80)
        shell: bash
        run: |
          set -euo pipefail
          rich_sha="40955a7838beb8fb76e74fd4b941ce4bb7cd1505"
          test "$(git -C rich-source rev-parse HEAD)" = "$rich_sha"
          rich="$GITHUB_WORKSPACE/site/preview/rich-presets-pr301"
          stable="$GITHUB_WORKSPACE/site/preview/encounters-v80"
          test -d "$stable"
          test ! -e "$rich"
          mkdir -p "$rich"
          cp rich-source/sculpt-lab.html rich-source/sculpt-lab-v80.html "$rich/"
          cp rich-source/world-assembler.html rich-source/builder.html rich-source/index.html "$rich/"
          cp rich-source/manifest.webmanifest "$rich/"
          for folder in src assets; do
            mkdir -p "$rich/$folder"
            rsync -a --exclude='.git' "rich-source/$folder/" "$rich/$folder/"
          done
          mkdir -p "$rich/combat-preview" "$rich/capture-assets"
          rsync -a --exclude='.git' combat-source/ "$rich/combat-preview/"
          rsync -a --exclude='.git' capture-source/ "$rich/capture-assets/"
          jq -n --arg main "$(git -C combat-source rev-parse HEAD)" \
            --arg author "$(git -C combat-author rev-parse HEAD)" \
            --arg assets "$(git -C capture-source rev-parse HEAD)" \
            --arg exploration "$rich_sha" \
            '{schema:"gensrpg-exploration-combat-release-v1",combatMain:$main,authorShowcase:$author,visualAssets:$assets,exploration:$exploration}' \
            > "$rich/release-provenance.v1.json"
          # These byte-level sentinels prevent mixing the two editors or
          # their persisted WorldDocument / Portal owners.
          cmp rich-source/sculpt-lab.html "$rich/sculpt-lab.html"
          cmp rich-source/world-assembler.html "$rich/world-assembler.html"
          cmp encounter-source/sculpt-lab.html "$stable/sculpt-lab.html"
          cmp encounter-source/world-assembler.html "$stable/world-assembler.html"
          test -s "$rich/src/sculpt-lab-main.js"
          test -s "$rich/src/builder/world-assembler-main.js"
          grep -Fq 'const RICH=Object.freeze' "$rich/src/builder/sculpt-builtin-map-presets.js"
          ! grep -Fq 'const RICH=Object.freeze' "$stable/src/builder/sculpt-builtin-map-presets.js"
          jq -e --arg sha "$rich_sha" '.exploration==$sha' "$rich/release-provenance.v1.json" >/dev/null
          jq -e --arg sha "$EXPLORATION_SOURCE_SHA" '.exploration==$sha' "$stable/release-provenance.v1.json" >/dev/null
          echo 'SAFE: main + V80 unchanged; pinned PR301 preserved by every full Pages deployment'
      - name: Stage verified PR318 narrow-road slope preview without changing PR301 or frozen V80
        shell: bash
        run: |
          set -euo pipefail
          ramp_sha="0dc90b9778b0a9e530adf7e90ac6d2506599c952"
          test "$(git -C ramp-source rev-parse HEAD)" = "$ramp_sha"
          ramp="$GITHUB_WORKSPACE/site/preview/ramp-pr316"
          test ! -e "$ramp"
          test -d "$GITHUB_WORKSPACE/site/preview/rich-presets-pr301"
          test -d "$GITHUB_WORKSPACE/site/preview/encounters-v80"
          mkdir -p "$ramp"
          cp ramp-source/sculpt-lab.html ramp-source/sculpt-lab-v80.html "$ramp/"
          cp ramp-source/world-assembler.html ramp-source/builder.html ramp-source/index.html "$ramp/"
          cp ramp-source/manifest.webmanifest "$ramp/"
          for folder in src assets; do
            mkdir -p "$ramp/$folder"
            rsync -a --exclude='.git' "ramp-source/$folder/" "$ramp/$folder/"
          done
          mkdir -p "$ramp/combat-preview" "$ramp/capture-assets"
          rsync -a --exclude='.git' combat-source/ "$ramp/combat-preview/"
          rsync -a --exclude='.git' capture-source/ "$ramp/capture-assets/"
          jq -n --arg main "$(git -C combat-source rev-parse HEAD)" \
            --arg author "$(git -C combat-author rev-parse HEAD)" \
            --arg assets "$(git -C capture-source rev-parse HEAD)" \
            --arg exploration "$ramp_sha" \
            '{schema:"gensrpg-exploration-combat-release-v1",combatMain:$main,authorShowcase:$author,visualAssets:$assets,exploration:$exploration}' \
            > "$ramp/release-provenance.v1.json"
          # The raster and the special legacy Object ramp MUST both use the
          # actual surface painting material. An old PR301 preview fails here.
          grep -Fq 'ctx.closePath();ctx.clip();' "$ramp/src/render/sculpt-ramp-renderer.js"
          grep -Fq 'paintSurface,paintImages}))terrainRampCount++' "$ramp/src/render/sculpt-height-renderer.js"
          grep -Fq 'paintSurface:surface,paintImages:surfacePaintImages' "$ramp/src/sculpt-lab-main.js"
          cmp ramp-source/sculpt-lab.html "$ramp/sculpt-lab.html"
          cmp rich-source/sculpt-lab.html site/preview/rich-presets-pr301/sculpt-lab.html
          cmp encounter-source/sculpt-lab.html site/preview/encounters-v80/sculpt-lab.html
          jq -e --arg sha "$ramp_sha" '.exploration==$sha' "$ramp/release-provenance.v1.json" >/dev/null
          echo 'PR316 test-only preview staged; PR301, main & V80 unchanged'
      - name: Real Chromium test of the assembled preview, not a mock page
        shell: bash
        run: |
          set -euo pipefail
          preview="$GITHUB_WORKSPACE/site/preview/encounters-v80"
          ln -s "$GITHUB_WORKSPACE/encounter-source/scripts" "$preview/scripts"
          (
            cd "$preview"
            node scripts/smoke-sculpt-terrain-lab.mjs
            node scripts/smoke-exploration-music-playback.mjs
          )
          rm "$preview/scripts"
      - name: Real Chromium PR318 painted road width in assembled ramp preview
        shell: bash
        run: |
