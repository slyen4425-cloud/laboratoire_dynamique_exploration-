          (
            cd "$ramp"
            node scripts/smoke-sculpt-terrain-lab.mjs
          )
          rm "$ramp/scripts"
      - name: Stage isolated PR320 waterfall-water and terrain-height preview
        shell: bash
        run: |
          set -euo pipefail
          source_sha="d4b9d8c804e592392c5b7a2ec7cc2f160291a076"
          test "$(git -C waterfall-source rev-parse HEAD)" = "$source_sha"
          folder="$GITHUB_WORKSPACE/site/preview/waterfall-height-pr320"
          test ! -e "$folder"
          test -d "$GITHUB_WORKSPACE/site/preview/ramp-pr316"
          test -d "$GITHUB_WORKSPACE/site/preview/rich-presets-pr301"
          test -d "$GITHUB_WORKSPACE/site/preview/encounters-v80"
          mkdir -p "$folder"
          cp waterfall-source/sculpt-lab.html waterfall-source/sculpt-lab-v80.html "$folder/"
          cp waterfall-source/world-assembler.html waterfall-source/builder.html waterfall-source/index.html "$folder/"
          cp waterfall-source/manifest.webmanifest "$folder/"
          for asset in src assets; do
            mkdir -p "$folder/$asset"
            rsync -a --exclude='.git' "waterfall-source/$asset/" "$folder/$asset/"
          done
          mkdir -p "$folder/combat-preview" "$folder/capture-assets"
          rsync -a --exclude='.git' combat-source/ "$folder/combat-preview/"
          rsync -a --exclude='.git' capture-source/ "$folder/capture-assets/"
          jq -n --arg main "$(git -C combat-source rev-parse HEAD)" \
            --arg author "$(git -C combat-author rev-parse HEAD)" \
            --arg assets "$(git -C capture-source rev-parse HEAD)" \
            --arg exploration "$source_sha" \
            '{schema:"gensrpg-exploration-combat-release-v1",combatMain:$main,authorShowcase:$author,visualAssets:$assets,exploration:$exploration}' \
            > "$folder/release-provenance.v1.json"
          grep -Fq 'SCULPT_TERRAIN_MAX_LEVEL=16' "$folder/src/world/sculpt-height-model.js"
          grep -Fq 'waterAllowed===true' "$folder/src/world/sculpt-scene-preview.js"
          grep -Fq 'sculptWaterAt(terrain,col,row)>0' "$folder/src/render/sculpt-object-picking.js"
          grep -Fq 'id="target" type="range" min="0" max="16"' "$folder/sculpt-lab.html"
          # Real user regression: after a legacy 7-level scene, the actual
          # detailed +/- and quickbar must be able to select 8..16.
          grep -Fq 'Math.min(SCULPT_TERRAIN_MAX_LEVEL,Number(level))' "$folder/src/sculpt-lab-main.js"
          grep -Fq 'world-room-full-editor-v1-height16-ui-r1' "$folder/sculpt-lab.html"
          cmp waterfall-source/sculpt-lab.html "$folder/sculpt-lab.html"
          cmp ramp-source/sculpt-lab.html site/preview/ramp-pr316/sculpt-lab.html
          cmp rich-source/sculpt-lab.html site/preview/rich-presets-pr301/sculpt-lab.html
          cmp encounter-source/sculpt-lab.html site/preview/encounters-v80/sculpt-lab.html
          jq -e --arg sha "$source_sha" '.exploration==$sha' "$folder/release-provenance.v1.json" >/dev/null
          echo 'PR320 staged; approved slopes, PR301, stable V80 unchanged'
      - name: Real Chromium PR325 actual target +/- and slider level 16 plus waterfalls
        shell: bash
        run: |
          set -euo pipefail
          waterfall="$GITHUB_WORKSPACE/site/preview/waterfall-height-pr320"
          ln -s "$GITHUB_WORKSPACE/waterfall-source/scripts" "$waterfall/scripts"
          (
            cd "$waterfall"
            node scripts/smoke-sculpt-terrain-lab.mjs
          )
          rm "$waterfall/scripts"
      - name: Stage full unified mobile trial without replacing V80
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="77607520574c8509becf91a6dc55783e29c1570c"
          test "$(git -C unified-source rev-parse HEAD)" = "$candidate_sha"
          test "$(git -C site rev-parse HEAD)" = 933c852c41c4511cb0eed0717c246cc6b19aeddc
          trial="$GITHUB_WORKSPACE/site/preview/unified-candidate"
          test ! -e "$trial"
          for historic in encounters-v80 rich-presets-pr301 ramp-pr316 waterfall-height-pr320; do
            test -s "site/preview/$historic/sculpt-lab.html"
          done
          mkdir -p "$trial"
          cp unified-source/sculpt-lab.html unified-source/sculpt-lab-v80.html "$trial/"
          cp unified-source/world-assembler.html unified-source/builder.html unified-source/index.html "$trial/"
          cp unified-source/manifest.webmanifest "$trial/"
          for folder in src assets; do
            mkdir -p "$trial/$folder"
            rsync -a --exclude='.git' "unified-source/$folder/" "$trial/$folder/"
          done
          mkdir -p "$trial/combat-preview" "$trial/capture-assets"
          rsync -a --exclude='.git' combat-source/ "$trial/combat-preview/"
          rsync -a --exclude='.git' capture-source/ "$trial/capture-assets/"
          jq -n --arg exploration "$candidate_sha" \
            --arg main "$(git -C combat-source rev-parse HEAD)" \
            --arg author "$(git -C combat-author rev-parse HEAD)" \
            --arg assets "$(git -C capture-source rev-parse HEAD)" \
            '{schema:"gensrpg-exploration-combat-release-v1",exploration:$exploration,combatMain:$main,authorShowcase:$author,visualAssets:$assets,stage:"test-only-unified-candidate"}' \
            > "$trial/release-provenance.v1.json"
          # Independent proof of full source and gameplay rules: NOT a mock UI.
          cmp unified-source/sculpt-lab.html "$trial/sculpt-lab.html"
          cmp unified-source/src/sculpt-lab-main.js "$trial/src/sculpt-lab-main.js"
          cmp unified-source/world-assembler.html "$trial/world-assembler.html"
          grep -Fq 'SCULPT_TERRAIN_MAX_LEVEL=16' "$trial/src/world/sculpt-height-model.js"
          grep -Fq 'Math.min(SCULPT_TERRAIN_MAX_LEVEL,Number(level))' "$trial/src/sculpt-lab-main.js"
          grep -Fq 'waterAllowed===true' "$trial/src/world/sculpt-scene-preview.js"
          grep -Fq 'const RICH=Object.freeze' "$trial/src/builder/sculpt-builtin-map-presets.js"
          grep -Fq 'id="sculpt-encounter-area-inherit"' "$trial/sculpt-lab.html"
          grep -Fq 'id="family-encounter-area-inherit"' "$trial/builder.html"
          grep -Fq 'createNewWorldBuilderDraft' "$trial/src/builder/world-assembler-main.js"
          grep -Fq 'chanceMultiplierPercent: area.encounters?.chanceMultiplierPercent' "$trial/src/encounters/encounter-controller.js"
          jq -e --arg sha "$candidate_sha" '.exploration==$sha and .combatMain==.authorShowcase' \
            "$trial/release-provenance.v1.json" >/dev/null
          # Guard against altering the pinned production V80 byte-for-byte.
          cmp site/sculpt-lab-v80.html encounter-source/sculpt-lab-v80.html
          echo 'ONE unified Pixel trial staged independently, V80 root and older links preserved'
      - name: Test actual assembled unified candidate in Chromium
        shell: bash
        run: |
          set -euo pipefail
          trial="$GITHUB_WORKSPACE/site/preview/unified-candidate"
          ln -s "$GITHUB_WORKSPACE/unified-source/scripts" "$trial/scripts"
          (
            cd "$trial"
            node scripts/smoke-sculpt-terrain-lab.mjs
          )
          rm "$trial/scripts"
      - name: Stage canonical World Builder entry for root URLs
        shell: bash
        run: |
          set -euo pipefail
          # Explicit first-party URL alias. WorldDocument stays in canonical
          # /preview/encounters-v80; frozen V80 bytes and source are untouched.
          test -s site/preview/encounters-v80/world-assembler.html
          test -s site/preview/encounters-v80/src/builder/world-assembler-main.js
          test ! -e site/world-assembler.html
          cat > site/world-assembler.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>World Builder — Labo Exploration</title>
            <meta http-equiv="refresh" content="0;url=./preview/encounters-v80/world-assembler.html">
            <link rel="canonical" href="./preview/encounters-v80/world-assembler.html">
          </head>
          <body>
            <p>Ouvrir le <a href="./preview/encounters-v80/world-assembler.html">World Builder 2,5D</a>.</p>
          </body>
          </html>
          HTML
          grep -Fq 'content="0;url=./preview/encounters-v80/world-assembler.html"' site/world-assembler.html
          cmp site/sculpt-lab-v80.html encounter-source/sculpt-lab-v80.html
      - name: Stage public Jouer entry alongside canonical world
        shell: bash
        run: |
          set -euo pipefail
          test -s site/preview/encounters-v80/play.html
          test ! -e site/play.html
          cat > site/play.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <title>Jouer — Labo Exploration</title>
            <meta http-equiv="refresh" content="0;url=./preview/encounters-v80/play.html">
            <link rel="canonical" href="./preview/encounters-v80/play.html">
          </head>
          <body><a href="./preview/encounters-v80/play.html">Jouer une partie</a></body>
          </html>
          HTML
          grep -Fq 'content="0;url=./preview/encounters-v80/play.html"' site/play.html
          cmp site/sculpt-lab-v80.html encounter-source/sculpt-lab-v80.html
      - name: Compact official Capture assets to catalog-only files
        shell: bash
        run: |
          set -euo pipefail
          # Staging copy only; sources in capture-source and its .git remain intact.
          rm -rf site/preview/encounters-v80/capture-assets
          node encounter-source/scripts/stage-pages-capture-assets.mjs capture-source site/preview/encounters-v80/capture-assets
          test -s site/preview/encounters-v80/capture-assets/data/assets/catalog/global-visual-assets.v1.json
          test -s site/preview/encounters-v80/capture-assets/assets/library/capture/creatures/heriplante/animations/movement/opponent/atlases/heriplante_movement_opponent_12f.webp
      - name: Check release size and duplicate asset directories
        shell: bash
        run: |
          set -euo pipefail
          node encounter-source/scripts/prune-pages-duplicate-previews.mjs site
          ! find site/preview -mindepth 2 -type d -name capture-assets | grep -v '/encounters-v80/capture-assets'
          ! find site/preview -mindepth 2 -type d -name combat-preview | grep -v '/encounters-v80/combat-preview'
          for old in rich-presets-pr301 ramp-pr316 waterfall-height-pr320 unified-candidate; do
            test -s "site/preview/$old/historical-preview-alias.v1.json"
          done
          cmp site/sculpt-lab-v80.html encounter-source/sculpt-lab-v80.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: [detect-upstream, verify-and-assemble]
    if: github.event_name != 'pull_request' && needs.detect-upstream.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout V80 pinned source for byte-for-byte production check
        uses: actions/checkout@v4
        with:
          ref: 933c852c41c4511cb0eed0717c246cc6b19aeddc
          path: release-check
      - name: Verify retired trial URLs redirect to maintained World Builder without duplicated assets
        shell: bash
        run: |
          set -euo pipefail
          root="https://slyen4425-cloud.github.io/laboratoire_dynamique_exploration-"
          for old in rich-presets-pr301 ramp-pr316 waterfall-height-pr320 unified-candidate; do
            alias="$root/preview/$old"
            for page in sculpt-lab.html world-assembler.html builder.html index.html play.html; do
              curl -fsSL --retry 16 --retry-all-errors --retry-delay 3 \
                "$alias/$page?run=$GITHUB_RUN_ID" -o /tmp/historic-alias.html
              grep -Fq "../encounters-v80/$page" /tmp/historic-alias.html
              grep -Fq "ancienne prévisualisation est archivée" /tmp/historic-alias.html
            done
            curl -fsSL --retry 16 --retry-all-errors --retry-delay 3 \
              "$alias/historical-preview-alias.v1.json?run=$GITHUB_RUN_ID" -o /tmp/historic-alias.json
            jq -e --arg name "$old" '.kind=="exploration-historical-preview-redirect" and .name==$name' /tmp/historic-alias.json >/dev/null
          done
          curl -fsSL --retry 16 --retry-all-errors --retry-delay 3 \
            "$root/sculpt-lab-v80.html?run=$GITHUB_RUN_ID" -o /tmp/frozen-v80.html
          cmp release-check/sculpt-lab-v80.html /tmp/frozen-v80.html
          echo "LIVE: all historic preview links redirect; frozen V80 byte-identical"
      - name: Verify live HTTPS pages, assets and untouched V80
        shell: bash
        run: |
          set -euo pipefail
          base="https://slyen4425-cloud.github.io/laboratoire_dynamique_exploration-"
          probe="$base/preview/encounters-v80"
          curl -fsSL --retry 16 --retry-all-errors --retry-delay 4 "$base/sculpt-lab-v80.html?build=$GITHUB_SHA" -o /tmp/published-v80.html
          cmp release-check/sculpt-lab-v80.html /tmp/published-v80.html
          curl -fsSL --retry 16 --retry-all-errors --retry-delay 4 "$probe/sculpt-lab.html?encounterTest=1&build=$GITHUB_SHA" -o /tmp/published-encounter.html
          grep -Fq 'id="sculpt-encounter-preview"' /tmp/published-encounter.html
          grep -Fq 'id="mode-encounters"' /tmp/published-encounter.html
          grep -Fq 'id="sculpt-encounter-family"' /tmp/published-encounter.html
          grep -Fq 'id="world-area-portal-panel"' /tmp/published-encounter.html
          grep -Fq 'class="world-area-portal-panel" hidden>' /tmp/published-encounter.html
          grep -Fq 'world-portal-v1-compact-ux-v1' /tmp/published-encounter.html
          grep -Fq 'id="world-portal-traverse"' /tmp/published-encounter.html
          grep -Fq 'id="world-area-portal-label"' /tmp/published-encounter.html
          grep -Fq 'id="world-area-portal-label-save"' /tmp/published-encounter.html
          grep -Fq 'id="sculpt-map-preset-save"' /tmp/published-encounter.html
          grep -Fq 'id="sculpt-map-preset-apply"' /tmp/published-encounter.html
          grep -Fq 'href="./world-assembler.html"' /tmp/published-encounter.html
          # Public HTTPS must serve ALL four exact listening copies.
          while read -r name digest; do
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 \
              "$probe/assets/runtime/audio/exploration-v1/$name?build=$GITHUB_SHA" -o "/tmp/$name"
            printf '%s  %s\n' "$digest" "/tmp/$name" | sha256sum -c -
          done <<'EXPLORATION_AUDIO'
          exploration-01.mp3 c3a0cfffa5f022c4f1c23b8eaa7673a61781669f400c7a38bbeb9572c64a3657
          exploration-02.mp3 5a10067b885ab5c1fa99ec9b8337679903bd294679b636991d9a1fd4e98868d7
          exploration-03.mp3 ec94c86e82861899dd1f6771794acfa6c0645a4e8d6f545338f3875f06ee8ad8
          exploration-04.mp3 2b9374c98e41a2343fe01027101f48e3443b87ee0043d107f585be7ffe657ce6
          EXPLORATION_AUDIO
          curl -fsSL "$probe/world-assembler.html?build=$GITHUB_SHA" -o /tmp/published-world-assembler.html
          grep -Fq 'id="graph-nodes"' /tmp/published-world-assembler.html
          grep -Fq 'id="edit-sculpt-area"' /tmp/published-world-assembler.html
          grep -Fq 'id="world-workspace-map"' /tmp/published-world-assembler.html
          grep -Fq 'id="area-width"' /tmp/published-world-assembler.html
          grep -Fq 'id="area-height"' /tmp/published-world-assembler.html
          grep -Fq 'id="world-workspace-world"' /tmp/published-encounter.html
          grep -Fq 'id="world-area-create-another"' /tmp/published-encounter.html
          grep -Fq 'id="world-map-preset-select"' /tmp/published-world-assembler.html
          grep -Fq 'id="world-map-preset-create"' /tmp/published-world-assembler.html
          grep -Fq 'id="world-playable-route"' /tmp/published-world-assembler.html
          grep -Fq '<details id="navigation-hud"' /tmp/published-encounter.html
          grep -Fq 'id="world-portal-feedback"' /tmp/published-encounter.html
          grep -Fq 'id="world-workspace-return-float"' /tmp/published-encounter.html
          grep -Fq 'id="world-area-unavailable-return"' /tmp/published-encounter.html
          grep -Fq 'id="world-area-unavailable-create"' /tmp/published-encounter.html
          curl -fsSL "$probe/builder.html?build=$GITHUB_SHA" -o /tmp/published-area-editor.html
          grep -Fq 'id="world-assembler-back"' /tmp/published-area-editor.html
          curl -fsSL "$probe/src/builder/world-assembler-main.js?build=$GITHUB_SHA" -o /tmp/published-world-assembler.js
          grep -Fq 'connectWorldAreas' /tmp/published-world-assembler.js
          grep -Fq 'portalUi=compact1' /tmp/published-world-assembler.js
          curl -fsSL "$probe/src/builder/world-assembler.css?build=$GITHUB_SHA" -o /tmp/published-world-assembler.css
          test -s /tmp/published-world-assembler.css
          curl -fsSL "$probe/src/sculpt-lab-main.js?build=$GITHUB_SHA" -o /tmp/published-encounter-main.js
          grep -Fq 'sculptEncounterStep' /tmp/published-encounter-main.js
          grep -Fq 'sculptEncounterConfig' /tmp/published-encounter-main.js
          grep -Fq 'traverseSculptWorldPortal' /tmp/published-encounter-main.js
          grep -Fq 'markersForSculptWorldArea' /tmp/published-encounter-main.js
          grep -Fq 'installSculptMapPresetPalette' /tmp/published-encounter-main.js
          grep -Fq 'persistCurrentWorldSculpt' /tmp/published-encounter-main.js
          grep -Fq 'sculptWorldAreaMounted' /tmp/published-encounter-main.js
          grep -Fq 'listAvailableSculptMapPresets' /tmp/published-encounter-main.js
          grep -Fq 'updateSculptWorldPortalAction' /tmp/published-encounter-main.js
          curl -fsSL "$probe/src/builder/world-area-size-command.js?build=$GITHUB_SHA" -o /tmp/published-area-size.js
          grep -Fq 'worldAreaSizeFromTiles' /tmp/published-area-size.js
          curl -fsSL "$probe/src/builder/sculpt-builtin-map-presets.js?build=$GITHUB_SHA" -o /tmp/published-builtin-maps.js
          grep -Fq 'builtinSculptMapPresets' /tmp/published-builtin-maps.js
          curl -fsSL "$probe/src/builder/sculpt-playable-zone-route.js?build=$GITHUB_SHA" -o /tmp/published-playable-route.js
          grep -Fq 'makePlayableZoneRoute' /tmp/published-playable-route.js
          grep -Fq "AUTHOR_SCULPT_MAP_SNAPSHOTS" /tmp/published-builtin-maps.js
          grep -Fq "AUTHOR_SNOW_MAP_SNAPSHOT" /tmp/published-builtin-maps.js
          curl -fsSL "$probe/src/builder/sculpt-author-map-snapshots.js?build=$GITHUB_SHA" -o /tmp/published-author-maps.js
          curl -fsSL "$probe/src/builder/sculpt-author-snow-map-snapshot.js?build=$GITHUB_SHA" -o /tmp/published-snow-map.js
          grep -Fq 'Forêt 1 · projet' /tmp/published-author-maps.js
          grep -Fq 'Plaine 1 · projet' /tmp/published-author-maps.js
          grep -Fq 'Neige 1 · projet' /tmp/published-snow-map.js
          curl -fsSL "$probe/src/builder/sculpt-map-preset-library.js?build=$GITHUB_SHA" -o /tmp/published-map-presets.js
          grep -Fq 'createWorldAreaFromSculptMapPreset' /tmp/published-map-presets.js
          grep -Fq 'function mapEdgePoint' /tmp/published-map-presets.js
          curl -fsSL "$probe/src/builder/sculpt-world-portal-markers.js?build=$GITHUB_SHA" -o /tmp/published-portal-markers.js
          grep -Fq "kind:'arrival'" /tmp/published-portal-markers.js
          curl -fsSL "$probe/src/builder/sculpt-world-area-link.js?build=$GITHUB_SHA" -o /tmp/published-sculpt-world-adapter.js
          grep -Fq 'saveSculptWorldArea' /tmp/published-sculpt-world-adapter.js
          curl -fsSL "$probe/combat-preview/examples/dom-demo/exploration-encounter.html?build=$GITHUB_SHA" -o /tmp/published-combat.html
          test -s /tmp/published-combat.html
          ! grep -Fq 'data-encounter-audio' /tmp/published-combat.html
          curl -fsSL "$probe/combat-preview/examples/dom-demo/exploration-encounter.js?build=$GITHUB_SHA" -o /tmp/published-combat-bridge.js
          grep -Fq 'startSoundtrackOnGesture' /tmp/published-combat-bridge.js
          grep -Fq 'privateAudioRuntimeAssetV1' /tmp/published-combat-bridge.js
          grep -Fq 'createCombatSoundtrackPreviewBridgeV1' /tmp/published-combat-bridge.js
          curl -fsSL -I "$probe/combat-preview/assets/runtime/audio/music-v1/battle-01-cb4ed87d.mp3?build=$GITHUB_SHA" >/dev/null
          curl -fsSL -I "$probe/combat-preview/assets/runtime/audio/private-v1/genrpg-pack2-f75d0d8f.mp3?build=$GITHUB_SHA" >/dev/null
          curl -fsSL --retry 16 --retry-all-errors --retry-delay 4 "$probe/release-provenance.v1.json?build=$GITHUB_SHA" -o /tmp/published-provenance.json
          jq -e --arg main "${{ needs.verify-and-assemble.outputs.combat_main }}" \
            --arg author "${{ needs.verify-and-assemble.outputs.author_showcase }}" \
            --arg assets "${{ needs.verify-and-assemble.outputs.visual_assets }}" \
             --arg exploration "$EXPLORATION_SOURCE_SHA" \
            '.schema=="gensrpg-exploration-combat-release-v1" and .combatMain==$main and .authorShowcase==$author and .visualAssets==$assets and .exploration==$exploration' \
            /tmp/published-provenance.json >/dev/null
          curl -fsSL --retry 16 --retry-all-errors --retry-delay 4 "$probe/combat-preview/data/capture/showcase/crea_nat_1.capture-creature-transfer-v1.json?build=$GITHUB_SHA" -o /tmp/published-grainou.json
          jq -e '.draft.id=="crea_nat_1" and ((.loadout.slots|map(.skillId)|index("Spore_soporifique"))!=null)' /tmp/published-grainou.json >/dev/null
          curl -fsSL --retry 16 --retry-all-errors --retry-delay 4 "$probe/combat-preview/data/capture/showcase/Spore_soporifique.capture-skill-transfer-v1.json?build=$GITHUB_SHA" -o /tmp/published-spore.json
          jq -e '.draft.id=="Spore_soporifique"' /tmp/published-spore.json >/dev/null
          curl -fsSL --retry 16 --retry-all-errors --retry-delay 4 "$probe/combat-preview/data/capture/showcase/encounter-bundle.v1.json?build=$GITHUB_SHA" -o /tmp/published-author-bundle.json
