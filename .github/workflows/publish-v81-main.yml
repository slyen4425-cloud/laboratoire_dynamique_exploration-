          curl -fsSL --retry 16 --retry-all-errors --retry-delay 4 "$probe/src/builder/preset-encounter-defaults.js?build=$GITHUB_SHA" -o /tmp/published-preset-encounter-defaults.js
          grep -Fq 'export function presetEncounterDefaults' /tmp/published-preset-encounter-defaults.js
          curl -fsSL --retry 16 --retry-all-errors --retry-delay 4 "$probe/src/builder/world-builder-draft.js?build=$GITHUB_SHA" -o /tmp/published-world-builder-draft.js
          grep -Fq 'initializeWorldPresetEncounters' /tmp/published-world-builder-draft.js
          grep -Fq 'retargetedPortalIds' /tmp/published-playable-route.js
          grep -Fq 'initializeEncounters' /tmp/published-playable-route.js
