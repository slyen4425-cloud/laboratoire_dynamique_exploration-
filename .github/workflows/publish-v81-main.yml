name: Publish Exploration to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'sculpt-lab-v*.html'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/publish-v81-main.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s sculpt-lab-v81.html
          test -d src
          test -d assets
          test -s index.html
          grep -q '<html' sculpt-lab-v81.html
          echo "Validated source SHA: ${GITHUB_SHA}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
