          grep -Fq "zoom=navigationCameraZoom()" /tmp/published-camera.js
          curl -fsSL "$probe/capture-assets/data/assets/catalog/global-visual-assets.v1.json?build=$GITHUB_SHA" -o /tmp/published-capture.json
