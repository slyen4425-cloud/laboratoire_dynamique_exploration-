          jq -e '.schema=="capture-author-encounter-bundle-v1" and .version==1 and
            ([.creatureTransfers[].draft.id]|index("crea_mossback")!=null) and
            ([.skillTransfers[].draft.id]|index("lib_earth_guard")!=null)' /tmp/published-author-bundle.json >/dev/null
          curl -fsSL "$probe/src/encounters/combat-outcome-hold-v1.js?build=$GITHUB_SHA" -o /tmp/published-outcome-hold.js
          grep -Fq 'CAPTURE_COMBAT_OUTCOME_HOLD_MS_V1 = 3000' /tmp/published-outcome-hold.js
