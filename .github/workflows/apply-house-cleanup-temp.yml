name: TEMP — Correct snow-house environment without changing their artwork
on:
  push:
    branches:
      - work/exploration-building-ground-props-removal-20261115
permissions:
  contents: write
jobs:
  clean-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic WebP alpha editing dependencies
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0' 'numpy==2.3.2'
      - name: Transform only native snow-home pixels
        run: |
          python scripts/cleanup-house-environment-pixels.py
          git diff --check
          git diff --name-only
          python - <<'PY'
          import json
          report=json.load(open('/tmp/house-ground-props-audit.json'))
          assert report['edited']==20
          assert report['unchanged']==10
          assert report['new_bytes']-report['old_bytes']<1500000
          assert all(0.9<=f['alpha_ratio']<1 for f in report['changes'])
          PY
      - name: Commit replacement WebPs and their canonical checksums
        run: |
          set -euo pipefail
          git add assets/exploration/objects/buildings/
          git diff --cached --name-only | grep -q '^assets/exploration/objects/buildings/'
          if git diff --cached --name-only | grep -Ev '^assets/exploration/objects/buildings/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(exploration): remove loose ground and grey lantern cutout pixels'
          git push origin HEAD:work/exploration-building-ground-props-removal-20261115
      - name: Publish per-file audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-house-environment-alpha-audit
          path: /tmp/house-ground-props-audit.json
          retention-days: 7
          if-no-files-found: warn
