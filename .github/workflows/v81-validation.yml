name: V81 validation
on:
  push:
    branches:
      - work/exploration-v81-mobile-settings-20261027
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Package V81 preview for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exploration-v81-preview
          path: |
            sculpt-lab-v80.html
            src/
            assets/
          if-no-files-found: error
