name: V81 validation
on:
  push:
    branches:
      - work/exploration-v81-mobile-settings-20261027
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Confirm preview entrypoint
        run: test -s sculpt-lab-v81.html
      - name: Package V81 preview for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exploration-v81-preview
          path: |
            sculpt-lab-v81.html
            src/
            assets/
          if-no-files-found: error

  publish-preview:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}v81/sculpt-lab-v81.html
    concurrency:
      group: exploration-v81-pages
      cancel-in-progress: false
    steps:
      - name: Checkout validated V80 root
        uses: actions/checkout@v4
        with:
          ref: work/exploration-v80-door-html-cachefix-20261026
          path: site
      - name: Checkout V81 isolated preview
        uses: actions/checkout@v4
        with:
          path: v81-source
      - name: Assemble independent V81 folder without altering V80
        run: |
          mkdir -p site/v81
          cp -a v81-source/sculpt-lab-v81.html v81-source/src v81-source/assets site/v81/
          if [ -d v81-source/capture-assets ]; then cp -a v81-source/capture-assets site/v81/; fi
          if [ -d v81-source/combat-preview ]; then cp -a v81-source/combat-preview site/v81/; fi
          test -s site/sculpt-lab-v80.html
          test -s site/v81/sculpt-lab-v81.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
