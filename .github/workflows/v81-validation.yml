name: V81 validation
on:
  push:
    branches:
      - work/exploration-v81-mobile-settings-20261027
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Confirm preview entrypoint
        run: test -s sculpt-lab-v81.html
      - name: Package V81 preview for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exploration-v81-preview
          path: |
            sculpt-lab-v81.html
            src/
            assets/
          if-no-files-found: error

  publish-preview:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V81 preview entrypoint
        run: test -s sculpt-lab-v81.html
      - name: Preserve validated preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B preview/v81
          git push --force origin preview/v81
