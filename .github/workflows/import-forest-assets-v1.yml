name: Import Forest Assets V1

on:
  push:
    branches:
      - 'work/exploration-asset-pack-forest-v1-2026-10-01'
    paths:
      - '.github/workflows/import-forest-assets-v1.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exploration lab
        uses: actions/checkout@v4
        with:
          ref: work/exploration-asset-pack-forest-v1-2026-10-01
          fetch-depth: 0

      - name: Checkout source assets read-only
        run: |
          git clone --depth 1 \
            --branch 'work/gensrpg-phase8-tactical-consolidation-preaudit-2026-10-01' \
            https://github.com/slyen4425-cloud/Zombicide-40k.git \
            _source_z40k

      - name: Copy curated forest pack
        run: |
          set -euo pipefail
          mkdir -p assets/exploration/biomes/forest
          for n in 01 02 03 04 05 06; do
            cp "_source_z40k/assets/dungeon/creatures/dng_floor_forest_${n}.png" \
               "assets/exploration/biomes/forest/floor_${n}.png"
          done
          rm -rf _source_z40k

      - name: Verify exact source blobs
        run: |
          set -euo pipefail
          declare -A expected=(
            [01]=b5c71de7baca66472976ba31e0993c928b8bff77
            [02]=89800f9e26985aec97cbb23e77892c2cdedf5798
            [03]=47535bbb06640aca89152144a31d0731fcc83724
            [04]=d9af16e588df6a6602aa7147888bcc279947e375
            [05]=58c94842c685a46527329dbb5aa8e963acd60d71
            [06]=ae88618e1d8631ad84af8dd24a819fae25c0e313
          )
          for n in 01 02 03 04 05 06; do
            actual="$(git hash-object "assets/exploration/biomes/forest/floor_${n}.png")"
            test "$actual" = "${expected[$n]}"
          done

      - name: Commit imported assets and retire importer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/exploration/biomes/forest
          git rm .github/workflows/import-forest-assets-v1.yml
          git commit -m "assets: import curated forest pack v1"
          git push origin HEAD:work/exploration-asset-pack-forest-v1-2026-10-01
