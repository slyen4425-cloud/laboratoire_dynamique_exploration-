name: Import Material Pack v1 Assets

on:
  push:
    branches:
      - work/exploration-material-pack-v1-2026-10-01
    paths:
      - '.import/material-pack-v1/**'
      - '.github/workflows/import-material-pack-v1-assets.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/exploration-material-pack-v1-2026-10-01
          fetch-depth: 0

      - name: Reconstruct generated asset archive
        shell: bash
        run: |
          set -euo pipefail
          cat             .import/material-pack-v1/part-000.txt             .import/material-pack-v1/part-001.txt             .import/material-pack-v1/part-002.txt             .import/material-pack-v1/part-003.txt             .import/material-pack-v1/part-004a.txt             .import/material-pack-v1/part-004b.txt             .import/material-pack-v1/part-005.txt             > /tmp/material-pack-v1.b64
          test "$(wc -c < /tmp/material-pack-v1.b64)" -eq 63592
          base64 -d /tmp/material-pack-v1.b64 > /tmp/material-pack-v1.zip
          echo "d2010f05942f8af93c12b3d47017a6e26a20b22bdf051eb3f708151fd46c1983  /tmp/material-pack-v1.zip" | sha256sum -c -
          unzip -o /tmp/material-pack-v1.zip -d .

      - name: Verify manifest hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path('assets/exploration/materials/forest/manifest.v1.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for item in manifest['files']:
              p = Path(item['path'])
              if not p.is_file():
                  raise SystemExit(f"Missing imported asset: {p}")
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != item['sha256']:
                  raise SystemExit(f"SHA256 mismatch: {p}")
          print(f"Verified {len(manifest['files'])} generated assets")
          PY

      - name: Commit imported assets and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import/material-pack-v1
          rm -f .github/workflows/import-material-pack-v1-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: import generated Material Pack v1 test textures"
          git push origin HEAD:work/exploration-material-pack-v1-2026-10-01
