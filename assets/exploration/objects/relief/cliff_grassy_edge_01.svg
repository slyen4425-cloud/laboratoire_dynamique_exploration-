<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 384">
<!-- Cliff kit V3: painted faces and a broken turf overhang, same visual footprint as V2. -->
<defs>
 <linearGradient id="stone" x1="0" y1="0" x2=".4" y2="1">
  <stop stop-color="#bd967b"/><stop offset=".37" stop-color="#8d7776"/><stop offset=".7" stop-color="#716574"/><stop offset="1" stop-color="#494c60"/>
 </linearGradient>
 <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#d9ae88"/><stop offset=".52" stop-color="#a88b7c"/><stop offset="1" stop-color="#726677"/>
 </linearGradient>
 <linearGradient id="turf" x1="0" y1="0" x2=".2" y2="1">
  <stop stop-color="#a5c768"/><stop offset=".68" stop-color="#739b50"/><stop offset="1" stop-color="#426f41"/>
 </linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#e2c8a1"/><stop offset=".55" stop-color="#c09e7b"/><stop offset="1" stop-color="#977c69"/>
 </linearGradient>
</defs>
<!-- rough silhouette deliberately non-rectangular and free of transparent checker panels -->
