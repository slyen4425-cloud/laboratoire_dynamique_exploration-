<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GenSrpg · Combat Capture officiel</title>
  <link rel="stylesheet" href="./demo.css">
  <link rel="stylesheet" href="./capture-editor-v2.css">
  <style>
    body { margin:0; background:#071016; }
    .encounter-fullscreen {position:fixed;z-index:160;top:max(.5rem, env(safe-area-inset-top));left:max(.5rem, env(safe-area-inset-left));padding:.45rem .7rem;border-radius:.6rem;background:#133340;color:white;border:1px solid #aee6f1;font:600 12px system-ui}
    .encounter-fullscreen[hidden]{display:none}
    .encounter-audio{position:fixed;z-index:165;right:max(.5rem,env(safe-area-inset-right));top:max(.5rem,env(safe-area-inset-top));padding:.55rem .75rem;border-radius:.6rem;background:#14524b;color:#fff;border:1px solid #b9eeda;font:600 13px system-ui;touch-action:manipulation}
    .encounter-audio[hidden]{display:none}
    .bridge-status {position:fixed;z-index:150;top:env(safe-area-inset-top);left:50%;
      transform:translateX(-50%);max-width:90vw;padding:.45rem .8rem;
      background:#09202b;color:white;border-radius:.5rem;font:600 13px system-ui;text-align:center}
    .bridge-status[data-ready="true"]{display:none}
    .bridge-status[data-error="true"]{background:#791c1c}
    .bridge-status[data-ending="true"]{display:block;top:37%;left:50%;width:max-content;
      max-width:82vw;font-size:clamp(1rem,3.3vw,1.6rem);padding:1rem 1.5rem;
      background:#123b48;border:1px solid #84dfc1;box-shadow:0 10px 35px #0009;
      z-index:170;pointer-events:none}
  </style>
</head>
<body>
  <section class="capture-preview-shell" data-capture-preview-shell data-landscape-required="true"
      aria-label="Combat Monster Capture">
    <div class="capture-preview-rotate-gate" role="status">
      <strong>Tourne ton téléphone</strong><span>Combat paysage</span>
    </div>
    <div class="capture-preview-host" data-capture-preview-host></div>
    <button type="button" class="encounter-fullscreen" data-encounter-fullscreen>⛶ Plein écran</button>
    <button type="button" class="encounter-audio" data-encounter-audio hidden>♪ Activer le son</button>
    <p class="bridge-status" data-bridge-status role="status">Chargement du moteur Combat officiel…</p>
  </section>
  <script type="module" src="./exploration-encounter.js"></script>
</body>
</html>
