<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GenSrpg · Combat Capture officiel</title>
  <link rel="stylesheet" href="./demo.css">
  <link rel="stylesheet" href="./capture-editor-v2.css">
  <style>
    body { margin:0; background:#071016; }
    .bridge-status {position:fixed;z-index:150;top:env(safe-area-inset-top);left:50%;
      transform:translateX(-50%);max-width:90vw;padding:.45rem .8rem;
      background:#09202b;color:white;border-radius:.5rem;font:600 13px system-ui;text-align:center}
    .bridge-status[data-ready="true"]{display:none}
    .bridge-status[data-error="true"]{background:#791c1c}
  </style>
</head>
<body>
  <section class="capture-preview-shell" data-capture-preview-shell data-landscape-required="true"
      aria-label="Combat Monster Capture">
    <div class="capture-preview-rotate-gate" role="status">
      <strong>Tourne ton téléphone</strong><span>Combat paysage</span>
    </div>
    <div class="capture-preview-host" data-capture-preview-host></div>
    <p class="bridge-status" data-bridge-status role="status">Chargement du moteur Combat officiel…</p>
  </section>
  <script type="module" src="./exploration-encounter.js"></script>
</body>
</html>
