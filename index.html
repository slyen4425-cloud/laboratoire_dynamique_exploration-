<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>GenSrpG — Labo Exploration</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Prototype exploration libre"></canvas>
    <section class="hud">
      <strong>GenSrpG Exploration — Phase 0</strong>
      <span id="coords">x: 0 y: 0</span>
    </section>
    <a id="builder-shortcut" class="builder-shortcut" href="./builder.html">World Builder</a>
    <section id="encounter-preview" class="encounter-preview" hidden>
      <strong>Rencontre détectée</strong>
      <span id="encounter-preview-summary"></span>
      <button id="encounter-preview-combat" type="button">
        Lancer le combat
      </button>
      <button id="encounter-preview-continue" type="button">
        Ignorer (test labo)
      </button>
    </section>
    <section id="world-event-dialog" class="world-event-dialog" hidden aria-live="polite">
      <strong>Message</strong>
      <p id="world-event-message"></p>
      <button id="world-event-close" type="button">Continuer</button>
    </section>

    <button id="world-interact" class="world-interact" type="button" hidden>
      Interagir
    </button>

    <section class="locomotion-controls" aria-label="Harnais de test locomotion" data-test-harness="locomotion">
      <span class="test-harness-label">TEST locomotion labo</span>
      <button type="button" data-locomotion="ground" class="active">Marche</button>
      <button type="button" data-locomotion="swim">Nage</button>
      <button type="button" data-locomotion="fly">Vol</button>
    </section>
    <div id="joystick" class="joystick" aria-label="Stick de déplacement">
      <div id="stick" class="stick"></div>
    </div>
  </main>
  <script type="module" src="./src/main.js?rev=surface-feather-v2-antibanding"></script>
</body>
</html>
